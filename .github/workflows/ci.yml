name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Lint and test
        run: bundle exec rake

      # Installed Gemfiles still name `rootcause-embassy`; both gem names must build from this checkout.
      - name: Build both gem names
        run: gem build replypen-embassy.gemspec && gem build rootcause-embassy.gemspec

      # The vendored goldens must be the hub's bytes, not a local edit. A wire
      # change starts in the hub; this is what makes "vendored" mean something.
      - name: Fixture parity with the contract hub
        run: |
          set -euo pipefail
          hub_sha="$(cat spec/fixtures/contract/HUB_SHA)"
          git clone --quiet https://github.com/replypen/replypen-embassy hub
          git -C hub checkout --quiet "$hub_sha"
          diff -r hub/fixtures spec/fixtures/contract --exclude HUB_SHA

      # Passing tests on stale fixtures is still out of conformance: fail when the
      # hub has moved the goldens since the commit we vendored.
      - name: Drift against the hub's fixtures
        run: |
          set -euo pipefail
          hub_sha="$(cat spec/fixtures/contract/HUB_SHA)"
          drift="$(git -C hub log --oneline "$hub_sha..origin/main" -- fixtures/)"
          if [ -n "$drift" ]; then
            echo "hub fixtures moved since $hub_sha:"
            echo "$drift"
            exit 1
          fi
